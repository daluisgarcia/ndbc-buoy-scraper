# Postgres tuning for the production target: 4 vCPU / 6 GB RAM / 600 GB disk.
#
# Mounted read-only by docker-compose.prod.yml and selected with
# `-c config_file=`. Values are sized for ONE fact you must not forget:
# DuckDB runs the silver transform ON THE SAME HOST and claims up to
# DUCKDB_MEMORY_LIMIT (default 1500 MB) while the load is in flight. Every
# figure below leaves room for that co-resident process.
#
# Peak memory budget during a load:
#   shared_buffers                1024 MB
#   DuckDB memory_limit           1500 MB
#   maintenance_work_mem           384 MB   (post-load index build)
#   work_mem x active backends    ~320 MB   (16 MB x 20 max_connections)
#   ---------------------------------------
#   ~3.2 GB, leaving ~2.8 GB for the OS and page cache.

# ---------------------------------------------------------------------------
# Memory
# ---------------------------------------------------------------------------
# Deliberately BELOW the usual 25%-of-RAM rule of thumb. This workload is bulk
# sequential writes plus analytical scans, and Postgres reads large sequential
# scans through a small ring buffer rather than filling shared_buffers with
# them -- so pages given up here are better spent on the OS page cache, which
# serves those same scans. Raise it only if the workload shifts to repeated
# point lookups.
shared_buffers = 1024MB

# Planner hint, not an allocation: how much cache (shared_buffers + OS page
# cache) the planner may assume when costing index vs. seq scans. Held
# conservative because DuckDB takes a real bite out of the page cache during
# loads.
effective_cache_size = 3500MB

# Per SORT/HASH NODE, per backend -- a single complex query can use several
# multiples of this, which is why the global value stays modest. For a heavy
# ad-hoc analytical query, raise it for that session only:
#     SET work_mem = '256MB';
work_mem = 16MB

# Index builds after each partition's bulk load. Bounded by
# max_parallel_maintenance_workers below.
maintenance_work_mem = 384MB

# This is an analytical database with a single writer, not an OLTP server.
# Low max_connections is what makes the work_mem math above safe.
max_connections = 20

# ---------------------------------------------------------------------------
# WAL and checkpoints
# ---------------------------------------------------------------------------
# The stock 1GB max_wal_size is the single worst default for this workload:
# a bulk load blows through it in seconds and triggers a checkpoint storm,
# where Postgres fsyncs continuously and the load crawls. 600 GB of disk makes
# a roomy WAL free.
max_wal_size = 8GB
min_wal_size = 1GB
checkpoint_completion_target = 0.9
checkpoint_timeout = 15min
wal_compression = on

# SAFE HERE, and NOT a setting to copy into an OLTP system. It trades "the last
# few hundred ms of committed transactions survive a crash" for a large write
# speedup. This database is DERIVED DATA: every row is reproducible from
# data/bronze by re-running the silver job. A crash costs a re-run, not data.
synchronous_commit = off

# ---------------------------------------------------------------------------
# Parallelism -- 4 vCPU, shared with the scraper and DuckDB
# ---------------------------------------------------------------------------
max_worker_processes = 4
max_parallel_workers = 4
max_parallel_workers_per_gather = 2
max_parallel_maintenance_workers = 2

# ---------------------------------------------------------------------------
# Storage assumptions (SSD/NVMe)
# ---------------------------------------------------------------------------
# Defaults assume spinning rust and make the planner irrationally afraid of
# index scans.
random_page_cost = 1.1
effective_io_concurrency = 200

# ---------------------------------------------------------------------------
# Autovacuum
# ---------------------------------------------------------------------------
# The fact table is append-then-swap: partitions are built once and replaced
# wholesale, so they accumulate almost no dead tuples and need little vacuum
# attention. The pressure is on pipeline_runs and observation_partitions, which
# are small and updated every run -- hence the scale factors tuned for small,
# frequently-updated tables rather than for the fact table.
autovacuum = on
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.02
autovacuum_naptime = 30s

# ---------------------------------------------------------------------------
# Observability
# ---------------------------------------------------------------------------
log_min_duration_statement = 5000   # log anything slower than 5s
log_checkpoints = on                # confirms max_wal_size is doing its job
log_autovacuum_min_duration = 10000
log_line_prefix = '%m [%p] %q%u@%d '
log_timezone = 'UTC'
timezone = 'UTC'

# NDBC data is UTC and the silver transform builds timezone-naive timestamps
# from it; pinning the server to UTC keeps `now()`-based freshness checks
# comparable to stored values regardless of the host's locale.
datestyle = 'iso, mdy'
lc_messages = 'C'

listen_addresses = '*'
